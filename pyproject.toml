[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datakit"
version = "0.1.0"
description = "A safety-first, human-oriented abstraction layer over NumPy, Pandas, Matplotlib, and Seaborn"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13"
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
stats = ["scipy>=1.11"]
excel = ["openpyxl>=3.1"]
arrow = ["pyarrow>=14.0"]
all = ["datakit[ml]", "datakit[stats]", "datakit[excel]", "datakit[arrow]"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/datakit"]
